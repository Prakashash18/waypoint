# Render blueprint. Deploy with: Render -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: waypoint
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Set every one of these in the Render dashboard. sync:false keeps them
      # out of git — Render will prompt for them when you apply the blueprint.
      - key: OPENAI_API_KEY          # required: without it the agent cannot plan
        sync: false
      - key: RAPIDAPI_KEY            # hotel rates, review scores, photographs
        sync: false
      - key: ELEVENLABS_API_KEY      # voice in and out
        sync: false
      - key: AVIATIONSTACK_API_KEY   # live flight delays
        sync: false
      - key: ATLAS_KEYRING_B64       # flights; see scripts/export-atlas-credential.sh
        sync: false
      - key: WEB_WORKERS
        value: 1                     # the free plan has 512 MB; Chromium needs room

# The free plan has no persistent disk and no shell, so the Atlas login cannot
# be performed on the server — hence ATLAS_KEYRING_B64 above. It also sleeps
# after 15 minutes idle, and the hotel rate cache is lost on each cold start.
#
# To move to the paid Starter plan later, change `plan: free` to `plan: starter`
# and add:
#
#   disk:
#     name: waypoint-data
#     mountPath: /var/waypoint
#     sizeGB: 1
