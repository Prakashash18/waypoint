<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin:0; font-family:Karla,"Helvetica Neue",Arial,sans-serif; }
    a { color:#b45332; text-decoration:none; } a:hover { color:#241f1a; }
    .serif { font-family:Newsreader,Georgia,serif; font-weight:400; letter-spacing:-0.015em; }
    .mono { font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; }
  </style>
</helmet>
<div style="width:390px; height:844px; background:#faf7f2; color:#241f1a; display:flex; flex-direction:column; padding-top:52px;">
  <div style="display:flex; align-items:center; gap:11px; padding:0 18px 14px; border-bottom:1px solid #e8e1d6;">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#6b6157" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l-6 6 6 6"/></svg>
    <span style="font-size:15px; color:#6b6157;">All three options</span>
  </div>

  <div style="flex-grow:1; overflow:hidden;">
    <img src="saka_house.jpg" alt="Saka House" style="width:100%; height:186px; object-fit:cover; display:block;">
    <div style="padding:18px 20px; display:flex; flex-direction:column; gap:13px;">
      <div>
        <span class="mono" style="font-size:12px; letter-spacing:0.12em; text-transform:uppercase; color:#b45332;">Best value</span>
        <h2 class="serif" style="margin:7px 0 5px; font-size:26px;">Saka House</h2>
        <p style="margin:0; font-size:15px; color:#3f6b4a; font-weight:600;">8.8 / 10 · 255 reviews</p>
      </div>

      <div style="display:flex; align-items:baseline; justify-content:space-between; padding:14px 0; border-top:1px solid #e8e1d6; border-bottom:1px solid #e8e1d6;">
        <p class="serif" style="margin:0; font-size:32px;">SGD 518</p>
        <p style="margin:0; font-size:14px; color:#6b6157; text-align:right;">for two · 4 nights<br>SGD 418 flights + SGD 100 stay</p>
      </div>

      <button style="width:100%; min-height:48px; background:#b45332; color:#ffffff; border:0; border-radius:11px; font:600 16px Karla,sans-serif; display:flex; align-items:center; justify-content:center; gap:9px;">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="9" y="2.5" width="6" height="11.5" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>
        Book the flight by voice
      </button>
      <button style="width:100%; min-height:48px; background:#f3eee6; color:#241f1a; border:1px solid #e8e1d6; border-radius:11px; font:600 16px Karla,sans-serif;">Book the stay ↗</button>

      <button style="display:flex; align-items:center; justify-content:space-between; width:100%; min-height:48px; padding:14px 16px; background:transparent; border:1px solid #e8e1d6; border-radius:12px; margin-top:2px;">
        <span style="font-size:15px; color:#6b6157;">Shift the dates — save up to SGD 55</span>
        <span style="font-size:19px; color:#9a9086;">›</span>
      </button>
    </div>
  </div>

  <div style="padding:13px 18px 30px; border-top:1px solid #e8e1d6; background:#ffffff; display:flex; align-items:center; gap:12px;">
    <button style="width:52px; height:52px; flex:none; border-radius:999px; border:0; background:#b45332; color:#ffffff; display:flex; align-items:center; justify-content:center;">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="9" y="2.5" width="6" height="11.5" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>
    </button>
    <span style="flex-grow:1; font-size:15px; color:#9a9086;">Is it quiet at night?</span>
  </div>
</div>
</x-dc>
</body>
</html>
