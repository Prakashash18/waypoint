<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    .theme-light {
      --paper:#faf7f2; --surface:#ffffff; --surface-2:#f3eee6;
      --ink:#241f1a; --dim:#6b6157; --faint:#9a9086; --line:#e8e1d6;
      --accent:#b45332; --accent-soft:#f8ece7; --good:#3f6b4a;
    }
    body { margin:0; font-family:Karla, "Helvetica Neue", Arial, sans-serif; }
    a { color:#b45332; text-decoration:none; } a:hover { color:#241f1a; }
    .serif { font-family:Newsreader, Georgia, serif; }
    .mono { font-family:"IBM Plex Mono", ui-monospace, Menlo, monospace; }
  </style>
</helmet>

<div class="theme-light" style="width:390px; height:844px; background:var(--paper); color:var(--ink); display:flex; flex-direction:column; padding-top:52px;">

  <div style="display:flex; align-items:center; justify-content:space-between; padding:0 20px 18px;">
    <div style="display:flex; align-items:center; gap:9px;">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--accent)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.3 7-11.4A7 7 0 0 0 5 9.6C5 14.7 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>
      <span class="serif" style="font-size:18px; font-weight:500;">Waypoint</span>
    </div>
    <span style="width:7px; height:7px; border-radius:99px; background:var(--good); display:block;"></span>
  </div>

  <div style="flex-grow:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 24px; gap:0;">
    <h1 class="serif" style="margin:0 0 12px; font-size:40px; line-height:1.1; font-weight:400; letter-spacing:-0.02em; text-align:center;">Where are we going?</h1>
    <p style="margin:0 0 18px; font-size:15.5px; line-height:1.55; color:var(--dim); text-align:center; text-wrap:pretty;">Dates optional — without them we'll find the cheapest window.</p>

    <div style="display:flex; align-items:center; gap:8px; padding:8px 13px; background:var(--surface); border:1px solid var(--line); border-radius:999px; margin-bottom:40px;">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="8"/></svg>
      <span style="font-size:12.5px; color:var(--ink); font-weight:600;">Kuala Lumpur · KUL</span>
      <a href="#" style="font-size:12.5px;">change</a>
    </div>

    <div style="position:relative; width:150px; height:150px; display:flex; align-items:center; justify-content:center; margin-bottom:14px;">
      <span style="position:absolute; inset:0; border-radius:999px; border:1px solid var(--line);"></span>
      <span style="position:absolute; inset:14px; border-radius:999px; border:1px solid var(--accent); opacity:0.3;"></span>
      <button style="width:112px; height:112px; border-radius:999px; border:0; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 12px 32px rgba(180,83,50,0.3);">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="9" y="2.5" width="6" height="11.5" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>
      </button>
    </div>
    <p style="margin:0; font-size:15px; font-weight:600;">Hold to speak</p>
  </div>

  <div style="padding:0 20px 34px; display:flex; flex-direction:column; gap:10px;">
    <div style="display:flex; align-items:center; gap:10px; padding:14px 16px; background:var(--surface); border:1px solid var(--line); border-radius:14px;">
      <span style="flex-grow:1; font-size:14.5px; color:var(--faint);">or type it…</span>
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="var(--faint)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
    </div>
    <div style="display:flex; gap:7px; overflow:hidden;">
      <span style="font-size:12.5px; color:var(--dim); padding:8px 13px; background:var(--surface-2); border-radius:999px; white-space:nowrap;">Quiet week in Bali</span>
      <span style="font-size:12.5px; color:var(--dim); padding:8px 13px; background:var(--surface-2); border-radius:999px; white-space:nowrap;">Cheap weekend away</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
